# dnspatch + Redis + a Telegram bot that reports what dnspatch does.
#
# Three small files are all you need, in one directory:
#
#   curl -LO https://raw.githubusercontent.com/dnspatch/dnspatch-telegram-bot/main/compose.yaml
#   curl -L  https://raw.githubusercontent.com/dnspatch/dnspatch-telegram-bot/main/.env.example -o .env
#   curl -L  https://raw.githubusercontent.com/dnspatch/dnspatch-telegram-bot/main/dnspatch.toml.example -o dnspatch.toml
#   # edit .env, and dnspatch.toml if your provider is not regru
#   docker compose up -d
#
# dnspatch publishes a small JSON event to the Redis channel
# dnspatch.events.<instance>: failures and recoveries, address changes, starts
# and stops, and a note about every cycle; the bot subscribes to it and
# forwards the events to Telegram (see EVENTS in .env.example).

services:
  dnspatch:
    # The notifiers are compiled into the -full image only, and the event types
    # used below need 0.4.1 or newer.
    image: ghcr.io/dnspatch/dnspatch:${DNSPATCH_VERSION:-latest}-full
    restart: unless-stopped
    environment:
      PASSWORD: ${PASSWORD:?set PASSWORD in .env}
      REDIS_URL: redis://redis:6379/0
    configs:
      - source: dnspatch
        target: /etc/dnspatch/config.toml
    depends_on:
      redis:
        condition: service_healthy
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    tmpfs:
      - /tmp # the image's HEALTHCHECK writes its status files here
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # Nothing is exposed to the host: only the two services below reach it.
    # The volume keeps what /status shows across restarts.
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

  bot:
    image: ghcr.io/dnspatch/dnspatch-telegram-bot:${BOT_VERSION:-latest}
    restart: unless-stopped
    environment:
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:?set TELEGRAM_TOKEN in .env}
      TELEGRAM_CHAT_IDS: ${TELEGRAM_CHAT_IDS:-}
      REDIS_URL: redis://redis:6379/0
      EVENTS: ${EVENTS:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      redis:
        condition: service_healthy
    logging: *logging
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

volumes:
  redis-data:

# The dnspatch config is a file next to this one: dnspatch.toml.
configs:
  dnspatch:
    file: ./dnspatch.toml
