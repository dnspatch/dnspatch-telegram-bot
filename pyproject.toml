[project]
name = "dnspatch-telegram-bot"
version = "0.1.0"
description = "Telegram bot that relays dnspatch status events from Redis Pub/Sub"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.31.0",
    "pydantic>=2.13.5",
    "redis>=8.1.0",
]

[project.scripts]
dnspatch-telegram-bot = "dnspatch_telegram_bot:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fakeredis>=2.38.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
    "ty>=0.0.84",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203", # conflicts with D211
    "D213", # conflicts with D212
    "COM812", # conflicts with the formatter
    "CPY001", # no copyright headers in the files
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101", # assert is how pytest checks
    "PLR2004", # magic values are fine in expected results
    "D100", "D103", # tests are named after what they check
]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.terminal]
error-on-warning = true

[tool.ty.rules]
all = "error"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = ["--cov=dnspatch_telegram_bot", "--cov-report=term-missing", "--cov-fail-under=80"]
testpaths = ["tests"]

[tool.coverage.run]
omit = ["*/__main__.py"]
